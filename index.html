const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 960, H = 540, T = 36, ROWS = 15, COLS = 205;
const ARENA_L = COLS*T - W;
ctx.imageSmoothingEnabled = false; ctx.lineJoin = "round";

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + "px"; cv.style.height = (H * s) + "px";
}
addEventListener("resize", fit); fit();

let AC = null, musicOn = true, voiceOn = true, musicTimer = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); }
function beep(f, d=0.1, type="square", vol=0.08, slide=0){
  if(!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide), t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}
const SFX = {
  jump: ()=>beep(330,0.15,"square",0.06,500),
  heart:()=>{beep(988,0.07,"square",0.05);setTimeout(()=>beep(1319,0.12,"square",0.05),60)},
  stomp:()=>beep(200,0.12,"triangle",0.12,-120),
  hurt: ()=>beep(160,0.35,"sawtooth",0.08,-100),
  boss: ()=>beep(90,0.5,"sawtooth",0.1,-40),
  fire: ()=>beep(500,0.2,"sawtooth",0.04,-380),
  win:  ()=>[523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"square",0.07),i*130))
};
// простая оригинальная мелодия-луп
const MEL = [523,0,659,784,659,0,523,587, 659,0,784,880,784,659,587,0, 523,0,659,784,1047,0,880,784, 659,587,523,0,587,659,523,0];
const BASS= [131,131,165,165,175,175,196,196];
let mStep = 0;
function startMusic(){
  if(musicTimer) clearInterval(musicTimer);
  musicTimer = setInterval(()=>{
    if(!musicOn || !AC || state==="title") return;
    const n = MEL[mStep % MEL.length]; if(n) beep(n,0.12,"square",0.025);
    if(mStep%4===0) beep(BASS[(mStep/4|0)%BASS.length],0.25,"triangle",0.05);
    mStep++;
  }, 150);
}
function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[!.]+/g,""));
    u.lang = "ru-RU"; u.rate = 1.05; u.pitch = 0.9;
    const v = speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang)); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ======================= ВВОД =======================
const keys = {}; let pressedJump = false, pressedStart = false, pressedSay = false;
addEventListener("keydown", e=>{
  const k = e.code;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(k)) e.preventDefault();
  if(!keys[k]){
    if(k==="Space"||k==="ArrowUp"||k==="KeyW"||k==="KeyZ") pressedJump = true;
    if(k==="Enter"||k==="Space") pressedStart = true;
    if(k==="KeyF") pressedSay = true;
    if(k==="KeyM") musicOn = !musicOn;
    if(k==="KeyV") voiceOn = !voiceOn;
  }
  keys[k] = true; audio();
});
addEventListener("keyup", e=>{ keys[e.code] = false; });
cv.addEventListener("pointerdown", ()=>{ audio(); pressedStart = true; });
if("ontouchstart" in window || navigator.maxTouchPoints>0) document.body.classList.add("touch");
function bindBtn(id, code){
  const el = document.getElementById(id);
  const on = e=>{ e.preventDefault(); audio(); if(!keys[code]){ if(code==="Space"){pressedJump=true;pressedStart=true;} if(code==="KeyF") pressedSay=true; } keys[code]=true; };
  const off= e=>{ e.preventDefault(); keys[code]=false; };
  el.addEventListener("touchstart",on,{passive:false}); el.addEventListener("touchend",off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off);
}
bindBtn("bL","ArrowLeft"); bindBtn("bR","ArrowRight"); bindBtn("bJ","Space"); bindBtn("bS","KeyF");
const L = ()=>keys.ArrowLeft||keys.KeyA, R = ()=>keys.ArrowRight||keys.KeyD, JUMPHELD = ()=>keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ;

let map, hearts, enemies, movers, triggers, fireballs, particles, floaters;
const GROUND = 13;
function buildLevel(){
  map = Array.from({length:ROWS},()=>new Array(COLS).fill(0));
  hearts = []; enemies = []; movers = []; triggers = []; fireballs = []; particles = []; floaters = [];
  const ground=(a,b,top=GROUND)=>{for(let x=a;x<=b;x++)for(let y=top;y<ROWS;y++)map[y][x]=1;};
  const bricks=(a,b,y,t=2)=>{for(let x=a;x<=b;x++)map[y][x]=t;};
  const heartRow=(a,b,y)=>{for(let x=a;x<=b;x++)hearts.push({x:x*T+T/2,y:y*T+T/2,got:false});};
  const enemy=(c)=>enemies.push({x:c*T,y:(GROUND-1)*T,w:30,h:30,vx:-1.1,dir:-1,vy:0,alive:true,dead:0});
  const stairsUp=(a,n)=>{for(let i=0;i<n;i++)for(let y=GROUND-1-i;y<GROUND;y++)map[y][a+i]=3;};
  const stairsDown=(a,n)=>{for(let i=0;i<n;i++)for(let y=GROUND-n+i;y<GROUND;y++)map[y][a+i]=3;};

  // Зона 1 — разминка
  ground(0,30); bricks(9,13,9); heartRow(9,13,7); heartRow(4,6,11); enemy(18); enemy(25);
  bricks(16,17,6); heartRow(16,17,4);
  // яма
  ground(34,60); heartRow(31,33,9);

function newPlayer(x){ return {x, y:(GROUND)*T-64, w:28, h:64, vx:0, vy:0, onGround:false, face:1, inv:0, coyote:0, buf:0, walk:0, onMover:null}; }

function moveX(o){
  o.x += o.vx;
  const top = o.y+2, bot = o.y+o.h-2;
  if(o.vx>0){
    const r = o.x+o.w;
    for(let yy=top; yy<=bot; yy+= Math.min(T-2, bot-yy||1)) if(solidAt(r,yy)){ o.x = Math.floor(r/T)*T - o.w - 0.01; o.vx = 0; o.hitWall=true; break; }
  } else if(o.vx<0){
    for(let yy=top; yy<=bot; yy+= Math.min(T-2, bot-yy||1)) if(solidAt(o.x,yy)){ o.x = (Math.floor(o.x/T)+1)*T + 0.01; o.vx = 0; o.hitWall=true; break; }
  }
}
function moveY(o){
  o.y += o.vy; o.onGround = false;
  const l = o.x+2, r = o.x+o.w-2;
  if(o.vy>0){
    const b = o.y+o.h;
    if(solidAt(l,b)||solidAt(r,b)){ o.y = Math.floor(b/T)*T - o.h; o.vy = 0; o.onGround = true; }
  } else if(o.vy<0){
    if(solidAt(l,o.y)||solidAt(r,o.y)){ o.y = (Math.floor(o.y/T)+1)*T; o.vy = 0; o.bonk = true; }
  }
}

}

// ======================= ОБНОВЛЕНИЕ =======================
function update(){
  stateT++;
  if(state==="title"){ if(pressedStart){ resetGame(); state="play"; stateT=0; audio(); startMusic(); say("Держись, "+PRINCESS+"! Я иду!",150);} return; }
  if(state==="over"){ if(stateT>60 && pressedStart) respawn(); return; }
  if(state==="ending"){ updateEnding(); return; }

  const p = player;
  // мовер-платформы (эскалатор)
  for(const m of movers){
    m.t += m.sp; const k = (Math.sin(m.t*Math.PI*2)+1)/2;
    const nx = m.x1+(m.x2-m.x1)*k, ny = m.y1+(m.y2-m.y1)*k;
    m.dx = nx-m.x; m.dy = ny-m.y; m.x = nx; m.y = ny;
  }
  if(p.onMover){ p.x += p.onMover.dx; p.y += p.onMover.dy; }

  // управление
  const acc = p.onGround?0.55:0.38, max = (keys.ShiftLeft||keys.ShiftRight)?6:4.3;
  if(L()){ p.vx -= acc; p.face=-1; } else if(R()){ p.vx += acc; p.face=1; }
  else p.vx *= p.onGround?0.78:0.94;
  p.vx = Math.max(-max, Math.min(max, p.vx)); if(Math.abs(p.vx)<0.05) p.vx=0;

  if(pressedJump) p.buf = 8;
  if(p.onGround||p.onMover) p.coyote = 7;
  if(p.buf>0 && p.coyote>0){ p.vy = -13.4; p.buf=0; p.coyote=0; p.onMover=null; SFX.jump(); }
  if(!JUMPHELD() && p.vy<-4) p.vy = -4;
  p.buf--; p.coyote--;
  p.vy = Math.min(p.vy+0.58, 14);

  moveX(p);
  if(boss.active && !boss.dead && p.x < ARENA_L) { p.x = ARENA_L; p.vx = 0; }
  const prevBottom = p.y+p.h;
  moveY(p);
  // приземление на эскалатор
  p.onMover = null;
  for(const m of movers){
    if(p.vy>=0 && p.x+p.w>m.x+4 && p.x<m.x+m.w-4 && prevBottom<=m.y+Math.max(6,m.dy+6) && p.y+p.h>=m.y-1){
      p.y = m.y-p.h; p.vy = 0; p.onMover = m; p.onGround = true;
    }
  }
  if(p.onGround && Math.abs(p.vx)>0.3) p.walk += Math.abs(p.vx)*0.09; else p.walk = 0;
  if(p.inv>0) p.inv--;

  // падение в пропасть
  if(p.y > H+80){ lives--; SFX.hurt(); if(lives<=0){ state="over"; stateT=0; say(PHRASES[2]); } else { const l=lives; player=newPlayer(checkpoint); lives=l; player.inv=90; say(PHRASES[0],120);} return; }

  // сердечки
  for(const h of hearts) if(!h.got && Math.abs(p.x+p.w/2-h.x)<24 && Math.abs(p.y+p.h/2-h.y)<40){
    h.got = true; heartCount++; SFX.heart(); burst(h.x,h.y,"#ff4f7b",6);
    if(heartCount%25===0 && lives<5){ lives++; floaters.push({x:h.x,y:h.y,t:60,text:"+1 жизнь"}); }
  }

  // враги-огоньки
  for(const e of enemies){
    if(!e.alive){ e.dead++; continue; }
    if(Math.abs(e.x - p.x) > W*1.2) continue;
    e.vy = Math.min(e.vy+0.5,12); e.hitWall=false; e.vx = e.dir*1.1; moveX(e);
    if(e.hitWall) e.dir = -e.dir;
    moveY(e);
    if(e.onGround){ const ahead = e.dir>0 ? e.x+e.w+2 : e.x-2; if(!solidAt(ahead, e.y+e.h+4)) e.dir = -e.dir; }
    if(e.y>H+50) e.alive=false;
    if(overlap(p,e)){
      if(p.vy>0 && prevBottom <= e.y+12){ e.alive=false; p.vy = -9; SFX.stomp(); burst(e.x+15,e.y+15,"#ff9a2a",10); floaters.push({x:e.x,y:e.y,t:50,text:"бум!"}); }
      else hurt();
    }
  }

  // триггеры фраз / чекпоинты
  for(const t of triggers) if(!t.done && p.x > t.x){
    t.done = true; say(t.text); checkpoint = t.x - T;
    if(t.boss){ boss.active = true; SFX.boss(); shake = 20; }
  }

  updateBoss(prevBottom);

  // финал: дотронуться до Яны
  if(boss.dead && cageOpen>=1 && Math.abs((p.x+p.w/2)-(yana.x+30))<50){
    state="ending"; stateT=0; endT=0; say(PHRASES[2],200); SFX.win();
  }
  if(pressedSay) say(PHRASES[Math.random()*PHRASES.length|0], 140);

  // камера
  let target = p.x - W*0.4;
  if(boss.active && !boss.dead) target = Math.max(target, ARENA_L - 20);
  target = Math.max(0, Math.min(target, COLS*T - W));
  camX += (target-camX)*0.15;

  common();
}
function common(){
  if(bubble && --bubble.t<=0) bubble=null;
  for(const q of particles){ q.x+=q.vx; q.y+=q.vy; q.vy+=0.2; q.t--; }
  particles = particles.filter(q=>q.t>0);
  for(const f of floaters){ f.y-=0.8; f.t--; } floaters = floaters.filter(f=>f.t>0);
  if(shake>0) shake*=0.88; if(shake<0.5) shake=0;
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function burst(x,y,c,n){ for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,t:30+Math.random()*20,c}); }

const BW = 26*5, BH = 20*5;
function updateBoss(prevBottom){
  const b = boss, p = player;
  if(b.dead){
    b.deadT++; b.y += b.deadT*0.15; b.x += 1;
    if(b.deadT>60) cageOpen = Math.min(1, cageOpen+0.012);
    return;
  }
  if(!b.active) return;
  b.t++; if(b.inv>0) b.inv--;
  const speed = 2.2 + (3-b.hp)*0.7;
  b.x += b.vx;
  if(b.x < ARENA_L+30){ b.vx = speed; } if(b.x > ARENA_R-BW-60){ b.vx = -speed; }
  // волна + пикирование
  if(b.swoop>0){ b.swoop--; b.y += (360 - b.y)*0.06; }
  else { b.y += ((150 + Math.sin(b.t*0.03)*60) - b.y)*0.05; if(b.t%300===150) b.swoop = 110; }
  // огонь
  if(--b.fireT<=0){
    b.fireT = 120 - (3-b.hp)*25;
    const mx = b.vx<0 ? b.x+10 : b.x+BW-10, my = b.y+40;
    const dx = p.x+p.w/2-mx, dy = p.y+p.h/2-my, d = Math.hypot(dx,dy)||1, s = 4+(3-b.hp)*0.6;
    fireballs.push({x:mx,y:my,vx:dx/d*s,vy:dy/d*s,t:0}); SFX.fire();
  }
  // столкновение
  const hb = {x:b.x+14, y:b.y+14, w:BW-28, h:BH-24};
  if(overlap(p,hb)){
    if(p.vy>0 && prevBottom <= hb.y+18 && b.inv===0){
      b.hp--; b.inv = 80; p.vy = -12; SFX.stomp(); shake = 16; burst(b.x+BW/2,b.y+20,"#b84dff",20);
      floaters.push({x:b.x+BW/2-30,y:b.y,t:60,text:"Получай, "+DRAGON+"!"});
      b.swoop = 0;
      if(b.hp<=0){ b.dead = true; SFX.win(); fireballs.length=0; say("Не бойся, "+PRINCESS+", я тут!",160); floaters.push({x:b.x,y:b.y-30,t:120,text:DRAGON+" повержен!"}); }
    } else if(b.inv<60) hurt();
  }
  for(const f of fireballs){
    f.x+=f.vx; f.y+=f.vy; f.t++;
    if(overlap(p,{x:f.x-8,y:f.y-8,w:16,h:16})){ f.t=999; hurt(); }
    if(solidAt(f.x,f.y)){ f.t=999; burst(f.x,f.y,"#ffb02a",5); }
  }
  fireballs = fireballs.filter(f=>f.t<400);
}

function updateEnding(){
  endT++; common();
  const p = player;
  if(endT<90){ // идут друг к другу
    const mid = (p.x + yana.x)/2;
    if(yana.x - p.x > 50){ p.x += 1.6; yana.x -= 1.2; p.walk += 0.15; p.face = 1; yana.face=-1; }
    camX += ((mid - W/2) - camX)*0.05;
  }
  if(endT%8===0) particles.push({x:camX+Math.random()*W,y:H+10,vx:(Math.random()-.5),vy:-2-Math.random()*2,t:400,c:"heart"});
  for(const q of particles) if(q.c==="heart") q.vy = Math.max(-2.5, q.vy - 0.21); // компенсируем гравитацию
  if(creditsDone && pressedStart){ state="title"; stateT=0; }
}

  const p = player; ctx.font="bold 17px Courier New";
  const w = ctx.measureText(bubble.text).width + 24, h = 34;
  let x = p.x + p.w/2 - camX - w/2, y = p.y - 62;
  x = Math.max(6, Math.min(W-w-6, x)); y = Math.max(6, y);
  const a = Math.min(1, bubble.t/15); ctx.globalAlpha = a;
  ctx.fillStyle="#fff"; ctx.strokeStyle="#111"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,10) : ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke();
  const tx = p.x+p.w/2-camX; ctx.beginPath(); ctx.moveTo(tx-8,y+h-1); ctx.lineTo(tx,y+h+12); ctx.lineTo(tx+8,y+h-1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx-8,y+h+1); ctx.lineTo(tx,y+h+12); ctx.lineTo(tx+8,y+h+1); ctx.stroke();
  ctx.fillStyle="#111"; ctx.fillText(bubble.text, x+12, y+23); ctx.globalAlpha=1;
}
function drawEnemy(e){
  const sx = e.x - camX, sy = e.y; if(sx<-40||sx>W+40) return;
  if(!e.alive){ if(e.dead<20){ ctx.fillStyle="#ff9a2a"; ctx.fillRect(sx,sy+22,30,8);} return; }
  const f = (stateT/8|0)%2;
  ctx.fillStyle="#e3262e"; ctx.beginPath(); ctx.moveTo(sx+15,sy-6-f*3); ctx.lineTo(sx+28,sy+18); ctx.lineTo(sx+2,sy+18); ctx.fill();
  ctx.fillStyle="#ff8a1e"; ctx.fillRect(sx+2,sy+8,26,20); ctx.fillStyle="#ffd84a"; ctx.fillRect(sx+7,sy+14,16,12);
  ctx.fillStyle="#111"; const ex = e.dir<0?0:4; ctx.fillRect(sx+8+ex,sy+14,4,6); ctx.fillRect(sx+16+ex,sy+14,4,6);
  ctx.fillRect(sx+4,sy+28,8,3+f*2); ctx.fillRect(sx+18,sy+28,8,5-f*2);
}
function drawBoss(){
  const b = boss; if(!b.active && camX < ARENA_L - W) return;
  if(!b.dead || b.y < H+100){
    if(!(b.inv>0 && (b.inv/4|0)%2)){
      const spr = (b.t/12|0)%2 ? dragA : dragB;
      ctx.save(); ctx.translate(Math.round(b.x-camX + BW/2), Math.round(b.y + BH/2));
      if(b.vx>0) ctx.scale(-1,1); if(b.dead) ctx.rotate(b.deadT*0.1);
      ctx.drawImage(spr,-BW/2,-BH/2); ctx.restore();
    }
    if(!b.dead){
      ctx.font="bold 15px Courier New"; ctx.textAlign="center"; ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=4;
      ctx.strokeText(DRAGON, b.x-camX+BW/2, b.y-8); ctx.fillText(DRAGON, b.x-camX+BW/2, b.y-8); ctx.textAlign="left";
    }
  }
  for(const f of fireballs){
    const sx = f.x-camX; ctx.fillStyle="#ff3b1e"; ctx.fillRect(sx-9,f.y-9,18,18);
    ctx.fillStyle="#ffb02a"; ctx.fillRect(sx-6,f.y-6,12,12); ctx.fillStyle="#fff6a0"; ctx.fillRect(sx-3,f.y-3,6,6);
  }
  if(b.active && !b.dead){
    ctx.fillStyle="#000a"; ctx.fillRect(W/2-160,14,320,26);
    ctx.fillStyle="#fff"; ctx.font="bold 14px Courier New"; ctx.fillText(DRAGON, W/2-150, 32);
    for(let i=0;i<3;i++){ ctx.fillStyle = i<b.hp?"#b84dff":"#333"; ctx.fillRect(W/2+10+i*46,20,40,14); }
  }
}
function drawCageAndYana(){
  const sx = CAGE_X - camX; if(sx<-200||sx>W+100) return;
  drawHero(yana, imgYana, 82, false);
  if(cageOpen<1){
    const lift = cageOpen*140, top = GROUND*T-110-lift;
    ctx.fillStyle="#555"; ctx.fillRect(sx,top-10,100,12);
    ctx.fillStyle="#333"; for(let i=0;i<=5;i++) ctx.fillRect(sx+i*19,top,5,110);
    if(!boss.dead && (stateT/90|0)%3===0){
      ctx.font="bold 14px Courier New"; ctx.fillStyle="#fff"; ctx.fillRect(sx-10,top-40,120,24);
      ctx.fillStyle="#d02060"; ctx.fillText("Максим, спаси!", sx-4, top-23);
    }
  }
}
function drawHUD(){
  for(let i=0;i<lives;i++) drawHeart(16+i*34,14,3);
  ctx.font="bold 20px Courier New"; ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=4;
  drawHeart(16,46,2.2,"#ff7aa2"); ctx.strokeText("× "+heartCount, 42, 63); ctx.fillText("× "+heartCount, 42, 63);
  ctx.font="12px Courier New"; const t = "F — фраза  M — музыка "+(musicOn?"вкл":"выкл")+"  V — голос "+(voiceOn?"вкл":"выкл");
  ctx.strokeText(t, W-ctx.measureText(t).width-12, H-12); ctx.fillText(t, W-ctx.measureText(t).width-12, H-12);
}
function drawParticles(){
  for(const q of particles){
    if(q.c==="heart") drawHeart(q.x-camX, q.y, 2, "#ff5c8a");
    else { ctx.fillStyle=q.c; ctx.fillRect(q.x-camX-3,q.y-3,6,6); }
  }
  ctx.font="bold 16px Courier New";
  for(const f of floaters){ ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=4; ctx.strokeText(f.text,f.x-camX,f.y); ctx.fillText(f.text,f.x-camX,f.y); }
}

function drawWorld(){
  ctx.save(); if(shake) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBg(); drawTiles();
  for(const h of hearts) if(!h.got){ const s=2.4+Math.sin(stateT*0.1+h.x)*0.25; drawHeart(h.x-camX-4.5*s, h.y-4*s, s); }
  for(const e of enemies) drawEnemy(e);
  drawCageAndYana(); drawBoss();
  if(!(player.inv>0 && (player.inv/5|0)%2)) drawHero(player, imgMax, 78, false);
  drawParticles(); drawBubble();
  ctx.restore();
}

function centerText(t, y, size, col="#fff"){ ctx.lineJoin="round";
  ctx.font = "bold "+size+"px Courier New"; ctx.textAlign="center";
  ctx.lineWidth = Math.max(4,size/5); ctx.strokeStyle="#1a0a2a"; ctx.strokeText(t,W/2,y);
  ctx.fillStyle=col; ctx.fillText(t,W/2,y); ctx.textAlign="left";
}

function drawTitle(){
  camX = (stateT*0.6)%2000; if(!map) buildLevel();
  drawBg(); drawTiles();
  ctx.fillStyle="rgba(20,10,40,.45)"; ctx.fillRect(0,0,W,H);
  const s = 1+Math.sin(stateT*0.05)*0.04;
  ctx.save(); ctx.translate(W/2,115); ctx.scale(s,s); ctx.translate(-W/2,-115);
  centerText("МАКСИМ", 105, 64, "#ffd84a"); centerText("спасает принцессу ЯНУ", 160, 34, "#ff9ec0"); ctx.restore();
  if(imgMax.complete) ctx.drawImage(imgMax, 110, 190, 110, 220);
  if(imgYana.complete) ctx.drawImage(imgYana, W-234, 190, 124, 220);
  const spr = (stateT/12|0)%2?dragA:dragB; ctx.drawImage(spr, W/2-BW/2, 200+Math.sin(stateT*0.05)*8);
  centerText("от дракона "+DRAGON, 340, 26, "#d6a8ff");
  if((stateT/30|0)%2) centerText("Нажми ENTER или тапни, чтобы начать", 405, 22);
  ctx.font="15px Courier New"; ctx.fillStyle="#fff"; ctx.textAlign="center";
  ctx.fillText("← → бег · Пробел/↑ прыжок · Shift ускорение · прыгай врагам на голову", W/2, 470);
  ctx.fillText("Собирай сердечки ♥ и победи дракона, прыгнув ему на спину 3 раза", W/2, 494);
  ctx.textAlign="left";
}
function drawOver(){
  drawWorld(); ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H);
  centerText("Ой-ой!", 210, 60, "#ff6b6b"); centerText("«Прости меня дурака...»", 270, 26, "#fff");
  if(stateT>60 && (stateT/30|0)%2) centerText("ENTER / тап — попробовать снова", 340, 22, "#ffd84a");
}
const CREDITS = [
  ["THE END", 54, "#ffd84a"], ["", 20],
  [HERO+" и "+PRINCESS, 46, "#fff"], ["навсегда вместе", 34, "#ff9ec0"], ["", 50],
  ["— В ГЛАВНЫХ РОЛЯХ —", 22, "#d6a8ff"],
  ["Максим .......... герой", 22, "#fff"],
  ["Яна .......... принцесса", 22, "#fff"],
  [DRAGON+" .......... дракон (повержен)", 22, "#fff"],
  ["Огоньки .......... массовка", 22, "#fff"], ["", 30],
  ["— ЛУЧШИЕ ФРАЗЫ —", 22, "#d6a8ff"],
  ...PHRASES.map(p=>["«"+p+"»", 20, "#ffe0ec"]), ["", 30],
  ["Студия misigames", 22, "#d6a8ff"], ["Сделано с любовью ♥", 22, "#fff"], ["", 40],
  ["И жили они долго и счастливо", 28, "#ffd84a"]
];
function drawEnding(){
  if(endT<150){ drawWorld(); }
  const fade = Math.min(1, Math.max(0,(endT-90)/60));
  if(fade>0){
    ctx.fillStyle = `rgba(60,10,50,${fade})`; ctx.fillRect(0,0,W,H);
    // большое сердце
    const pulse = 1 + Math.sin(endT*0.12)*0.06;
    const s = 52*Math.min(1,(endT-90)/80)*pulse;
    ctx.globalAlpha = fade;
    const glow = ctx.createRadialGradient(W/2,H/2-30,10,W/2,H/2-30,360);
    glow.addColorStop(0,"rgba(255,90,140,.45)"); glow.addColorStop(1,"rgba(255,90,140,0)");
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
    drawHeart(W/2-4.5*s, H/2-20-4.2*s, s, "#ff2d63");
    // герои в сердце
    if(imgMax.complete) ctx.drawImage(imgMax, W/2-105, H/2-110, 85, 170);
    if(imgYana.complete){ ctx.save(); ctx.translate(W/2+115,0); ctx.scale(-1,1); ctx.drawImage(imgYana, 0, H/2-110, 96, 170); ctx.restore(); }
    for(const q of particles) if(q.c==="heart") drawHeart(q.x-camX, q.y, 2.5, "#ff8fb0");
    ctx.globalAlpha = 1;
  }
  if(endT>260){
    const scroll = (endT-260)*1.4;
    let y = H + 40 - scroll;
    ctx.fillStyle="rgba(30,5,30,.55)"; ctx.fillRect(0,0,W,H);
    for(const [t,sz,col] of CREDITS){ y += sz*1.5; if(t && y>-40 && y<H+40) centerText(t, y, sz, col); }
    if(y < -30){ creditsDone = true; centerText(HERO+" ♥ "+PRINCESS, H/2-10, 52, "#ff9ec0"); centerText("навсегда вместе", H/2+45, 30, "#fff");
      if((endT/30|0)%2) centerText("ENTER / тап — сыграть ещё раз", H-40, 20, "#ffd84a"); }
  }
}

// ======================= ЦИКЛ =======================
state = "title"; stateT = 0;
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now-last); last = now;
  while(acc >= 1000/60){ update(); pressedJump = pressedStart = pressedSay = false; acc -= 1000/60; }
  ctx.clearRect(0,0,W,H);
  if(state==="title") drawTitle();
  else if(state==="over") drawOver();
  else if(state==="ending") drawEnding();
  else { drawWorld(); drawHUD(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
